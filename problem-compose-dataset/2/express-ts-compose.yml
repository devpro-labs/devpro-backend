version: "3.8"

services:
  express:
    image: express-ts
    ports:
      - "3000"
    restart: unless-stopped
    volumes:
      - ${PROJECT_PATH}:/app/src
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
      - CACHE_TTL_SECONDS=60
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis-common
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres-common
    restart: unless-stopped
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user" ]

networks:
  app-network:
    driver: bridge