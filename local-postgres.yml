version: "3.8"

services:
  postgres:
    image:  postgres:16-alpine
    container_name: postgres
    ports:
      - 5432:5432 #db
    environment:
      POSTGRES_DB: DevPro-dev
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: devan
  adminer:
    image: adminer
    restart: always
    ports:
      - 5433:8080 #ui

