spring:
  application:
    name: problem-service



  #database config
  datasource:
    url: ${DB_URL}
    username: ${DB_UNAME}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver


  #consul client
  cloud:
    consul:
      discovery:
        register: true
        instance-id: ${spring.application.name}-${server.port}
        prefer-ip-address: true
      host: localhost
      port: 8500


  #ddl
  jpa:
    hibernate:
      ddl-auto: update

#port
server:
  port: 8082

#health check
management:
  endpoints:
    web:
      exposure:
        include: health,info

admin:
  service:
    key: ${ADMIN_SERVICE_KEY}


#clodynairy
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_CLOUD_API_KEY}
  api-secret: ${CLOUDINARY_CLOUD_API_SECRET}
  folder: ${FOLDER_NAME}